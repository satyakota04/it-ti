pipeline:
  tags: {}
  projectIdentifier: qajt
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: itcheck
        repoName: it-ti
        build: <+input>
  stages:
    - stage:
        name: CI
        identifier: CI
        description: Run ITs against ngrok-exposed services (no services started in pipeline)
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
            override: true
            paths: []
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: deleciplay
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Setup TI agent
                  identifier: setup_ti_agent
                  spec:
                    connectorRef: testingggg
                    image: eclipse-temurin:17-jre
                    shell: Sh
                    command: |-
                      set -eu
                      # Agent artifacts are committed to this repo under ti-agent-artifacts/
                      ARTIFACT_DIR=/harness/ti-agent-artifacts
                      AGENT_JAR="$ARTIFACT_DIR/java-agent-trampoline.jar"
                      NATIVE_SO="$ARTIFACT_DIR/ti-agent.so"

                      if [ ! -f "$AGENT_JAR" ] || [ ! -f "$NATIVE_SO" ]; then
                        echo "Missing agent artifacts under $ARTIFACT_DIR" >&2
                        ls -la "$ARTIFACT_DIR" >&2 || true
                        exit 1
                      fi

                      # paths.env consumed by the runner step
                      mkdir -p /harness/ti-agents
                      echo "AGENT_JAR=$AGENT_JAR" | tee /harness/ti-agents/paths.env
                      echo "NATIVE_SO=$NATIVE_SO"  | tee -a /harness/ti-agents/paths.env

                      # Runner-only config (services run locally with their own agents)
                      TI_BASE=/harness/ti-it
                      RUNNER_DIR="$TI_BASE/runner"
                      mkdir -p "$RUNNER_DIR/native"

                      cat > "$RUNNER_DIR/config.ini" <<EOF
                      outDir: $RUNNER_DIR
                      logLevel: 6
                      logConsole: false
                      packageInference: false
                      instrPackages: com.harness.sample.it.
                      EOF

                      cat > "$RUNNER_DIR/native-config.json" <<EOF
                      {
                        "outdir": "$RUNNER_DIR/native",
                        "connectorPath": "$AGENT_JAR",
                        "logging": {
                          "level": "Debug",
                          "console": "false",
                          "file": "true",
                          "filePath": "$RUNNER_DIR/native-agent.log"
                        }
                      }
                      EOF

                      echo "=== Runner config ==="
                      cat "$RUNNER_DIR/config.ini"
                      echo "=== Agent artifacts ==="
                      ls -la "$AGENT_JAR" "$NATIVE_SO"
              - step:
                  type: Run
                  name: Wait and run ITs
                  identifier: wait_and_run_its
                  spec:
                    connectorRef: testingggg
                    image: maven:3.9-eclipse-temurin-17
                    shell: Sh
                    command: |-
                      set -eu

                      # ngrok public URLs (services running locally on Satya's mac)
                      ORDER_URL="https://order-kota.ngrok-free.dev"
                      INVENTORY_URL="https://inventory-kota.ngrok-free.dev"
                      SHIPPING_URL="https://shipping-kota.ngrok-free.dev"

                      echo "=== Service URLs ==="
                      echo "  order:     $ORDER_URL"
                      echo "  inventory: $INVENTORY_URL"
                      echo "  shipping:  $SHIPPING_URL"

                      # Health checks (ngrok may need a moment to tunnel)
                      wait_for() {
                        name="$1"
                        url="$2"
                        i=0
                        while [ "$i" -lt 30 ]; do
                          if curl -sf -H "ngrok-skip-browser-warning: true" "$url" >/dev/null 2>&1; then
                            echo "OK $name ready ($url)"
                            return 0
                          fi
                          i=$((i + 1))
                          sleep 2
                        done
                        echo "FAIL $name not ready: $url" >&2
                        exit 1
                      }

                      wait_for shipping "$SHIPPING_URL/eta/TEST-SKU"
                      wait_for inventory "$INVENTORY_URL/stock/TEST-SKU"

                      i=0
                      while [ "$i" -lt 30 ]; do
                        if curl -sf -H "ngrok-skip-browser-warning: true" -H "Content-Type: application/json" \
                          -X POST "$ORDER_URL/orders" \
                          -d '{"sku":"TEST","quantity":1}' >/dev/null 2>&1; then
                          echo "OK order ready ($ORDER_URL)"
                          break
                        fi
                        i=$((i + 1))
                        sleep 2
                      done
                      if [ "$i" -ge 30 ]; then
                        echo "FAIL order not ready" >&2
                        exit 1
                      fi

                      . /harness/ti-agents/paths.env
                      TI_BASE=/harness/ti-it
                      RUNNER_DIR="$TI_BASE/runner"

                      # Agent on forked surefire JVM via argLine (mirrors run-it-ti.sh)
                      export HARNESS_TI_AGENT_PATH="$NATIVE_SO"
                      export TI_AGENT_CONFIG="$RUNNER_DIR/native-config.json"

                      echo "=== Running ITs (agent on forked test JVM) ==="
                      echo "Agent jar:    $AGENT_JAR"
                      echo "Native agent: $NATIVE_SO"
                      echo "Runner cfg:   $RUNNER_DIR/config.ini"

                      cd /harness
                      TEST_EXIT=0
                      mvn test \
                        -DargLine="-javaagent:${AGENT_JAR}=$RUNNER_DIR/config.ini" \
                        -Dorder.service.url="$ORDER_URL" \
                        -Dinventory.service.url="$INVENTORY_URL" \
                        -Dshipping.service.url="$SHIPPING_URL" \
                        || TEST_EXIT=$?

                      if [ "$TEST_EXIT" -eq 0 ]; then
                        echo "Tests: PASSED"
                      else
                        echo "Tests: FAILED (exit $TEST_EXIT)"
                      fi

                      sleep 2

                      echo ""
                      echo "=== Call-graph output (sizes) ==="
                      FOUND=0
                      find "$TI_BASE" -type f \( \
                          -name 'unified-cg-*.ndjson' \
                          -o -name 'cg_*.json' \
                          -o -name 'cg_*.csv' \
                          -o -name 'cg_*.ndjson' \
                        \) 2>/dev/null > /tmp/cg-files.txt || true

                      while IFS= read -r f; do
                        [ -z "$f" ] && continue
                        FOUND=1
                        SIZE=$(wc -c < "$f" | tr -d ' ')
                        echo "  $f"
                        echo "    size: $SIZE bytes"
                      done < /tmp/cg-files.txt

                      if [ "$FOUND" -eq 0 ]; then
                        echo "  (none found under $TI_BASE)"
                        find "$TI_BASE" -type f 2>/dev/null | head -100 || true
                      fi

                      echo ""
                      echo "=== Unified CG ==="
                      find "$TI_BASE" -type f -name 'unified-cg-*.ndjson' 2>/dev/null | while IFS= read -r f; do
                        SIZE=$(wc -c < "$f" | tr -d ' ')
                        LINES=$(wc -l < "$f" | tr -d ' ')
                        echo "  path:  $f"
                        echo "  size:  $SIZE bytes"
                        echo "  lines: $LINES"
                      done

                      exit "$TEST_EXIT"
              - step:
                  type: Run
                  name: Print runner logs
                  identifier: print_runner_logs
                  spec:
                    connectorRef: testingggg
                    image: eclipse-temurin:17-jre
                    shell: Sh
                    command: |-
                      set -eu
                      TI_BASE=/harness/ti-it
                      DIR="$TI_BASE/runner"
                      echo "=== Runner log files ==="
                      ls -la "$DIR"/*.log 2>/dev/null
                      echo ""
                      echo "--- Key lines (ALL .log files, excluding Enqueue noise) ---"
                      grep -rhE 'Classified com\.harness|Registering method: com\.harness|Registering entry point: com\.harness|Stats:|RECORD|Opened call-graph|X-TI-Execution|Wrote unified|Attaching Harness TI|Process Id|Sending.*class prefix|Sending.*jar repo|collect|Collect' "$DIR"/*.log 2>/dev/null | grep -vE 'Enqueue:' | head -150
                      echo ""
                      echo "--- Enqueue count (Collector activity) ---"
                      grep -rh 'Enqueue:' "$DIR"/*.log 2>/dev/null | wc -l
                      echo ""
                      echo "--- Ignored/Instrumenting com.harness ---"
                      grep -rhE 'Ignored type: com\.harness|Instrumenting class: com\.harness' "$DIR"/*.log 2>/dev/null | head -20
                      echo ""
                      echo "=== Surefire dumpstream ==="
                      find /harness/target/surefire-reports -name "*.dumpstream" -type f 2>/dev/null | while IFS= read -r f; do
                        echo "----- $f -----"
                        head -50 "$f"
                      done || echo "(none)"
              - step:
                  type: Run
                  name: Print unified CG
                  identifier: print_cg_contents
                  spec:
                    connectorRef: testingggg
                    image: python:3.12-slim
                    shell: Sh
                    command: |-
                      set -eu
                      TI_BASE=/harness/ti-it
                      find "$TI_BASE" -type f -name 'unified-cg-*.ndjson' 2>/dev/null | sort | while IFS= read -r f; do
                        python3 -m json.tool "$f"
                      done
          buildIntelligence:
            enabled: false
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
        variables:
          - name: DOTNET_SYSTEM_GLOBALIZATION_INVARIANT
            type: String
            required: false
            value: "1"
  identifier: integration_tests_ngrok
  name: integration tests ngrok
